baseURL = 'https://sendipad.github.io/flexirule-docs/'
languageCode = 'en-US'
title = 'FlexiRule Docs'
theme = 'doks'

# For Doks theme
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true

[languages]
  [languages.en]
    languageName = 'English'
    contentDir = 'content/en'

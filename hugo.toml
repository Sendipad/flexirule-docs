      languageISO = 'EN'
      languageTag = 'en-US'
      footer = '© 2024 FlexiRule. Built for the Frappe Ecosystem.'
      titleHome = 'FlexiRule Documentation'

[module]
  [[module.imports]]
    path = 'github.com/hidetake/hugo-doks'

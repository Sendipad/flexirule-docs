# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["develop"]

  pull_request:
    branches: ["develop"]

  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages"
        required: true
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.1'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install static asset tooling
        run: npm install

      - name: Copy self-hosted fonts
        run: npm run copy-fonts

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          HUGO_BASEURL: ${{ vars.HUGO_BASEURL || 'https://sendipad.github.io/flexirule-docs/' }}
        run: |
          hugo \
            --minify \
            --baseURL "${{ env.HUGO_BASEURL }}"

      - name: Build Pagefind index
        run: npm run pagefind

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.deploy == true)

    steps:
      - name: Deploy to Local GitHub Pages
        if: "${{ vars.DEPLOY_REPOSITORY == '' || vars.DEPLOY_REPOSITORY == github.repository }}"
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Download Artifact for External Deploy
        if: "${{ vars.DEPLOY_REPOSITORY != '' && vars.DEPLOY_REPOSITORY != github.repository }}"
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./public_extracted

      - name: Extract Artifact
        if: "${{ vars.DEPLOY_REPOSITORY != '' && vars.DEPLOY_REPOSITORY != github.repository }}"
        run: |
          mkdir -p ./public
          tar -xvf ./public_extracted/artifact.tar -C ./public

      - name: Deploy to External Repository
        if: "${{ vars.DEPLOY_REPOSITORY != '' && vars.DEPLOY_REPOSITORY != github.repository }}"
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: ${{ vars.DEPLOY_REPOSITORY }}
          publish_branch: ${{ vars.DEPLOY_BRANCH || 'gh-pages' }}
          publish_dir: ./public
          commit_message: "docs: deploy to ${{ vars.DEPLOY_REPOSITORY }} [skip ci]"

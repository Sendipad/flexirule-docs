{{ $src := .Get "src" }}
{{ $alt := .Get "alt" }}
{{ $caption := .Get "caption" }}
{{ $cleanSrc := strings.TrimPrefix "/" $src }}
{{ $img := resources.Get (printf "images/%s" (strings.TrimPrefix "images/" $cleanSrc)) }}

<figure class="screenshot-frame">
  {{ if $img }}
    {{ $webp := $img.Resize "1200x webp" }}
    {{ $fallback := $img.Resize "1200x" }}
    <picture>
      <source srcset="{{ $webp.RelPermalink }}" type="image/webp">
      <img src="{{ $fallback.RelPermalink }}"
           alt="{{ $alt }}"
           width="{{ $img.Width }}"
           height="{{ $img.Height }}"
           loading="lazy"
           decoding="async">
    </picture>
  {{ else }}
    {{/* Fallback to static if resource not found */}}
    {{ $fallbackSrc := $src }}
    {{ if not (or (hasPrefix $fallbackSrc "http://") (hasPrefix $fallbackSrc "https://")) }}
      {{ $fallbackSrc = $cleanSrc | relURL }}
    {{ end }}
    <img src="{{ $fallbackSrc }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  {{ end }}
  {{ with $caption }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>

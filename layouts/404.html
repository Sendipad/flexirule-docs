{{ define "main" }}
<div class="docs-layout" style="grid-template-columns: 1fr; text-align: center; padding: var(--space-16) var(--space-5);">
  <article class="docs-content">
    <header class="doc-hero" style="border-bottom: 0; margin-bottom: var(--space-6); padding: 0;">
      <p class="eyebrow" style="margin-bottom: var(--space-4);">Error 404</p>
      <h1 style="font-size: clamp(3rem, 10vw, 5rem); margin-bottom: var(--space-4);">Page Not Found</h1>
      <p class="lead" style="margin: 0 auto; max-width: 32rem;">
        Sorry, we couldn't find the page you're looking for. It might have been moved, deleted, or never existed in the first place.
      </p>
    </header>

    <div class="hero-actions" style="justify-content: center; margin-top: var(--space-10);">
      <a href="{{ relLangURL "/" }}" class="btn btn-primary">
        Return Home
      </a>
      <button id="error-search-trigger" class="btn btn-secondary" onclick="document.getElementById('search-trigger')?.click()">
        <svg style="width: 1.1rem; height: 1.1rem;"><use href="#icon-search"/></svg>
        Search Documentation
      </button>
    </div>

    <div style="margin-top: var(--space-16); color: var(--color-soft); font-size: .9rem;">
      <p>If you believe this is a bug, please <a href="{{ .Site.Params.github_docs_repo }}/issues" target="_blank" rel="noopener noreferrer">report it on GitHub</a>.</p>
    </div>
  </article>
</div>
{{ end }}

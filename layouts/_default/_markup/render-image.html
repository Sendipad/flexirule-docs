{{ $src := .Destination }}
{{ if not (or (hasPrefix $src "http://") (hasPrefix $src "https://")) }}
  {{ $src = (strings.TrimPrefix "/" $src) | relURL }}
{{ end }}
<figure>
  <img src="{{ $src }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
  {{ with .Title | default .Text }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>

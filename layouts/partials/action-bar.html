{{ $contentPath := "" }}{{ if .File }}{{ $contentPath = printf "content/%s/%s" .Site.Language.Lang .File.Path }}{{ end }}
<div class="action-bar" aria-label="Page actions">
  <button class="action-btn" id="btn-copy-url" type="button"><svg><use href="#icon-link"/></svg><span>Copy link</span></button>
  <button class="action-btn" id="btn-copy-md" type="button"><svg><use href="#icon-copy"/></svg><span>Copy Markdown</span></button>
  {{ if .File }}
    <a class="action-btn" href="{{ .Site.Params.github_docs_repo }}/edit/{{ .Site.Params.github_branch }}/{{ $contentPath }}" target="_blank" rel="noopener noreferrer"><svg><use href="#icon-edit"/></svg><span>Improve this page</span></a>
    <a class="action-btn" href="{{ .Site.Params.github_docs_repo }}/blob/{{ .Site.Params.github_branch }}/{{ $contentPath }}" target="_blank" rel="noopener noreferrer"><svg><use href="#icon-external"/></svg><span>View source</span></a>
  {{ end }}
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="action-bar">
  <div class="action-group">
    <button class="action-btn" id="btn-print" title="Download PDF / Print">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      <span>PDF</span>
    </button>
    <button class="action-btn" id="btn-copy-url" title="Copy Page URL">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      <span>Link</span>
    </button>
    <button class="action-btn" id="btn-copy-md" title="Copy Markdown Source">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="7 15 12 10 17 15"></polyline></svg>
      <span>MD</span>
    </button>
  </div>
  <div class="action-divider"></div>
  <div class="action-group dropdown">
    <button class="action-btn dropdown-toggle" id="ai-dropdown-toggle">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 2a10 10 0 0 1 10 10h-10V2z"></path><path d="M12 12L2.2 9"></path><path d="M12 12L19.8 9"></path><path d="M12 12l-7.8 3"></path><path d="M12 12l7.8 3"></path><path d="M12 12V22"></path></svg>
      <span>AI Actions</span>
      <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 0.25rem;"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="dropdown-menu" id="ai-dropdown-menu">
      <div class="dropdown-header">Ask AI about this page</div>
      <button class="dropdown-item ai-btn" data-ai="chatgpt">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" width="16" height="16" alt="ChatGPT">
        <span>ChatGPT</span>
      </button>
      <button class="dropdown-item ai-btn" data-ai="claude">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/bd/Claude_AI_logo.svg" width="16" height="16" alt="Claude">
        <span>Claude</span>
      </button>
      <button class="dropdown-item ai-btn" data-ai="gemini">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" width="16" height="16" alt="Gemini">
        <span>Gemini</span>
      </button>
      <div class="dropdown-divider"></div>
      <div class="dropdown-header">FlexiRule App</div>
      {{ $appBrowserUrl := .Site.Params.app_browser_url | default "http://localhost:8000/app/flexirule" }}
      <button class="dropdown-item open-app-btn" data-protocol="flexirule://open">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        <span>Open in App</span>
      </button>
      <button class="dropdown-item open-browser-btn" data-url="{{ $appBrowserUrl }}">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <span>Open in Browser</span>
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast">Context copied to clipboard!</div>

.toast {

{{ if and .IsPage .TableOfContents }}
<aside class="toc" aria-label="On this page">
  <div class="toc-card">
    <div class="toc-title">On this page</div>
    <div class="toc-scroll" data-toc>{{ .TableOfContents }}</div>
  </div>
</aside>
<button id="toc-toggle" class="toc-toggle" type="button" aria-label="Open table of contents" aria-expanded="false"><svg><use href="#icon-toc"/></svg></button>
{{ end }}

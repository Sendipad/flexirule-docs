<footer class="py-12 border-t border-slate-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex items-center gap-2">
                <img src="{{ "images/flexiRule.png" | relURL }}" alt="FlexiRule Logo" class="h-6 w-6 opacity-50 grayscale">
                <span class="text-lg font-bold text-slate-400">FlexiRule</span>
            </div>
            <p class="text-slate-500 text-sm text-center">
                {{ .Site.Params.footer | default "Built with ❤️ by the community." | safeHTML }}
            </p>
            <div class="flex gap-6 text-slate-400">
                <a href="https://github.com/Sendipad/flexirule" class="hover:text-slate-900 transition-colors"><i class="fab fa-github text-xl"></i></a>
            </div>
        </div>
    </div>
</footer>

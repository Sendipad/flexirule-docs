<footer class="footer">
  <div class="footer-inner">
    <div class="footer-meta" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--color-border); color: var(--color-muted); font-size: 0.875rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; gap: 1.5rem;">
        <div>{{ .ReadingTime }} min read</div>
        {{ if .Site.Params.github_repo }}
          <a href="{{ .Site.Params.github_repo }}/edit/{{ .Site.Params.github_branch }}/content/{{ .Path }}" target="_blank" rel="noopener" style="color: var(--color-muted);">
            {{ T "edit_on_github" }}
          </a>
        {{ end }}
      </div>
      <div>© {{ now.Year }} FlexiRule</div>
    </div>
  </div>
</footer>

<header class="site-header">
  <div class="header-inner">
    <button id="mobile-menu-toggle" class="icon-button menu-button" type="button" aria-label="Open documentation menu" aria-controls="sidebar" aria-expanded="false"><svg><use href="#icon-menu"/></svg></button>
    <a class="brand" href="{{ .Site.BaseURL | relLangURL }}" aria-label="FlexiRule documentation home"><span class="brand-mark">F</span><span class="brand-text">FlexiRule</span><span class="brand-docs">Docs</span></a>
    <button id="search-trigger" class="search-trigger" type="button" aria-haspopup="dialog" aria-controls="search-dialog"><svg><use href="#icon-search"/></svg><span>Search documentation</span><kbd>⌘K</kbd></button>
    <div class="header-actions">
      <button id="command-trigger" class="icon-button" type="button" aria-label="Open command palette" title="Command palette"><svg><use href="#icon-command"/></svg></button>
      <label class="version-select"><span class="sr-only">Documentation version</span><select aria-label="Documentation version"><option>{{ .Site.Params.version | default "v1.0" }}</option></select></label>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme" title="Toggle theme"><svg class="theme-sun"><use href="#icon-sun"/></svg><svg class="theme-moon"><use href="#icon-moon"/></svg></button>
      <a class="icon-button" href="{{ .Site.Params.github_app_repo }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository" title="GitHub Repository"><svg><use href="#icon-github"/></svg></a>
    </div>
  </div>
  <div id="reading-progress" class="reading-progress" aria-hidden="true"></div>
</header>
<dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title" data-pagefind-script='{{ "pagefind/pagefind-ui.js" | relURL }}'>
  <div class="search-panel">
    <div class="search-panel-header">
      <h2 id="search-title">Search FlexiRule docs</h2>
      <button class="icon-button" type="button" data-dialog-close aria-label="Close search">×</button>
    </div>
    <div class="search-tools" aria-label="Search shortcuts">
      <div><span class="search-tools-label">Recent</span><div id="recent-searches" class="search-chip-row"></div></div>
      <div><span class="search-tools-label">Pinned</span><div id="pinned-searches" class="search-chip-row"></div></div>
    </div>
    <div id="pagefind-search" class="pagefind-root" data-pagefind-root></div>
    <p class="search-hint">Press <kbd>Esc</kbd> to close. Use arrow keys and <kbd>Enter</kbd> inside results. Searches are remembered locally.</p>
  </div>
</dialog>

{{ $prev := .PrevInSection }}{{ $next := .NextInSection }}
{{ if or $prev $next }}
<nav class="pager" aria-label="Documentation pagination">
  {{ with $prev }}<a href="{{ .RelPermalink }}" class="pager-link prev"><span class="pager-direction">Previous</span><span class="pager-title">{{ .Title }}</span></a>{{ else }}<span></span>{{ end }}
  {{ with $next }}<a href="{{ .RelPermalink }}" class="pager-link next"><span class="pager-direction">Next</span><span class="pager-title">{{ .Title }}</span></a>{{ end }}
</nav>
{{ end }}
